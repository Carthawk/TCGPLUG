<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The TCG Plug – strook</title>
<style>
/* OBS-strook: doorzichtige achtergrond, ontworpen op 1080 px breed */
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#f4efe4;width:1080px;transform-origin:0 0}
.strip{position:relative;margin:8px 14px;height:112px;padding:0 18px;display:flex;align-items:center;border-radius:22px;
 background:linear-gradient(180deg,rgba(26,21,12,.95),rgba(11,10,8,.97));border:2px solid #b8862b;
 box-shadow:0 0 0 1px rgba(255,236,170,.15) inset,0 10px 30px rgba(0,0,0,.55),0 0 34px rgba(227,171,60,.18);overflow:hidden}
.sep{width:2px;height:76px;background:linear-gradient(180deg,transparent,#8a6420,transparent);margin:0 18px;flex:none}
.lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#c9b892;font-weight:600}
.val{font-size:42px;font-weight:800;color:#f6d47a;line-height:1.02;text-shadow:0 0 24px rgba(246,212,122,.4);white-space:nowrap}
.sub{font-size:23px;color:#f4efe4;font-weight:800;line-height:1.1;margin-top:2px}
.now-l{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#46d6c8;font-weight:700;display:flex;align-items:center;gap:8px}
.now-l::before{content:"";width:10px;height:10px;border-radius:50%;background:#46d6c8;box-shadow:0 0 10px #46d6c8}
.now-head{display:flex;align-items:center;gap:12px}
.wait{font-size:13px;font-weight:800;color:#1a140a;background:#f6d47a;border-radius:999px;padding:2px 10px;letter-spacing:.04em;white-space:nowrap;box-shadow:0 0 12px rgba(246,212,122,.45)}
.wait:empty{display:none}
.wait.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.now{font-size:32px;font-weight:800;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now.empty{color:#a89b82;font-size:26px}
.prod{font-size:16px;color:#cfc4ae;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fan{position:relative;width:150px;height:72px;flex:none}
.c{position:absolute;bottom:0;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.c:nth-child(3){box-shadow:0 4px 10px rgba(0,0,0,.6),0 0 16px rgba(170,230,120,.6)}
.gp-title{font-size:22px;font-weight:900;letter-spacing:.05em;line-height:1;margin-top:4px;background:linear-gradient(90deg,#f6d47a,#fff6d6,#c9a0ff,#7ff3e6,#f6d47a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(246,212,122,.5))}
.col{display:flex;flex-direction:column}
.mid{flex:1;min-width:0;gap:2px}
.flash{animation:flash .9s ease}
@keyframes flash{30%{text-shadow:0 0 30px #fff6c8,0 0 50px rgba(246,212,122,.9)}}
.enter{animation:enter .6s ease}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
/* God Pack-moment */
.gp-moment{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;opacity:0;pointer-events:none;
 background:radial-gradient(circle at 50% 50%,rgba(246,212,122,.35),rgba(11,10,8,.98) 70%)}
.strip.cracked .gp-moment{opacity:1;transition:opacity .4s}
.strip.cracked > .col,.strip.cracked > .sep,.strip.cracked > .gpc{visibility:hidden}
.gp-big{font-size:58px;font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#f6d47a,#fff6d6,#c9a0ff,#7ff3e6,#f6d47a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(246,212,122,.7));animation:shine 2.4s linear infinite}
.gp-who{font-size:26px;font-weight:800;color:#f4efe4}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.spark{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0}
.strip.cracked .spark{animation:fall 2.2s linear infinite}
@keyframes fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translateY(130px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.gp-big,.strip.cracked .spark{animation:none}}
</style></head>

  <div class="gp-moment" aria-live="assertive"><span class="gp-big">GOD PACK!</span><span class="gp-who" id="gpWho"></span></div>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const fmt = new Intl.NumberFormat("nl-NL", {style:"currency", currency:"EUR"});
  const SETS = { ah: "Ascended Heroes kluis", "30th": "30th Celebration kluis" };
  // schalen naar de breedte van de OBS-bron (ontwerp: 1080 px)
  const fit = () => { const k = innerWidth / 1080; document.body.style.transform = "scale(" + k + ")"; };
  addEventListener("resize", fit); fit();
  // confetti-snippers voor het God Pack-moment
  const strip = $("strip"), cols = ["#f6d47a","#fff6d6","#c9a0ff","#7ff3e6","#e3a52d"];
  for (let i = 0; i < 40; i++){ const s = document.createElement("i"); s.className = "spark";
    s.style.left = (Math.random()*100) + "%"; s.style.top = "-10px"; s.style.background = cols[i % cols.length];
    s.style.animationDelay = (Math.random()*2.2) + "s"; s.style.animationDuration = (1.6 + Math.random()*1.4) + "s"; strip.appendChild(s); }
  let shown = null, target = 0, raf = null, lastNow = null;
  function animate(){
    cancelAnimationFrame(raf);
    const from = shown == null ? target : shown, t0 = performance.now(), dur = 1200;
    if (shown == null){ shown = target; $("val").textContent = fmt.format(target); return; }
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      shown = from + (target - from) * e; $("val").textContent = fmt.format(shown);
      if (k < 1) raf = requestAnimationFrame(step); else { $("val").classList.remove("flash"); void $("val").offsetWidth; $("val").classList.add("flash"); } };
    raf = requestAnimationFrame(step);
  }
  function show(st){
    if (!st) return;
    $("setName").textContent = SETS[st.theme] || SETS["30th"];
    const packs = Number(st.packs) || 0, price = Number(st.price) || 0;
    $("packs").textContent = packs + " packs";
    const t = Math.round(packs * price * 100) / 100; if (t !== target){ target = t; animate(); }
    const n = Array.isArray(st.queue) ? st.queue.length : 0;
    const wt = n === 0 ? "" : n + " wachtend";
    if ($("wait").textContent !== wt){ $("wait").textContent = wt; $("wait").classList.remove("bump"); void $("wait").offsetWidth; $("wait").classList.add("bump"); }
    const cur = st.current, name = cur ? cur.name : "";
    if (name !== lastNow){
      lastNow = name;
      $("now").textContent = name || "Niemand aan de beurt"; $("now").classList.toggle("empty", !name);
      $("prod").textContent = cur && cur.product ? String(cur.product).split("\n").join(" · ") : "";
      $("now").classList.remove("enter"); void $("now").offsetWidth; $("now").classList.add("enter");
    }
  }
  let crackTimer = null;
  function godPack(name){
    $("gpWho").textContent = name ? "voor " + name : "";
    strip.classList.add("cracked"); clearTimeout(crackTimer);
    crackTimer = setTimeout(() => strip.classList.remove("cracked"), 9000);
  }
  fetch("/api/state").then(r => r.json()).then(j => show(j.state)).catch(()=>{});
  // live-verbinding met het programma (herstelt zichzelf na een herstart)
  let es = null, versie = null;
  function connect(){
    es = new EventSource("/events?kijk=1");
    es.addEventListener("state", e => { try { show(JSON.parse(e.data).state); } catch(err){} });
    es.addEventListener("crack", e => { try { godPack(JSON.parse(e.data).name); } catch(err){ godPack(""); } });
    es.onopen = () => fetch("/api/state").then(r => r.json()).then(j => show(j.state)).catch(()=>{});
    es.onerror = () => { if (es.readyState === 2){ es.close(); setTimeout(connect, 3000); } };
  }
  if (location.protocol !== "file:") connect();
  // na een update van het programma laadt de strook zichzelf opnieuw
  function checkVersie(){
    fetch("/api/versie", {cache:"no-store"}).then(r => r.json()).then(j => {
      if (versie && j.v && j.v !== versie) location.reload(); else versie = versie || j.v;
    }).catch(()=>{});
  }
  if (location.protocol !== "file:"){ checkVersie(); setInterval(checkVersie, 15000); }
  // voorbeeld zonder programma (bijv. als los bestand geopend)
  if (location.protocol === "file:") show({theme:"ah", packs:200, price:16.99, queue:[{},{},{}], current:{name:"Dennis \u00b7 #1041", product:"2+1 Ascended Heroes kluis"}});
  if (/[?&]test=godpack/.test(location.search)) setTimeout(() => godPack("Dennis \u00b7 #1041"), 600);
})();
</script>
